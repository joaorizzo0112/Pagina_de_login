<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="conta.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Criação de Conta</title>
</head>
<body>
    <header>
        <a class="voltar" href="index.html">← Voltar</a>
    </header> 

    <main>
        <form action="" method="POST">
            <div class="criar-header">
                <h1>Criar Conta</h1>
                <div class="barra"></div>
            </div>

            <div class="linha-inputs">
                <div class="campo">
                    <label for="nome">Nome*</label>
                    <input type="text" name="nome" id="nome" placeholder="Seu nome" required>
                </div>
                <div class="campo">
                    <label for="sobrenome">Sobrenome*</label>
                    <input type="text" name="sobrenome" id="sobrenome" placeholder="Seu sobrenome" required>
                </div>
            </div>

            <div class="linha-inputs">
                <div class="campo">
                    <label for="email">E-mail*</label>
                    <input type="email" name="email" id="email" placeholder="exemplo@email.com" required>
                </div>
                <div class="campo">
                    <label for="data">Data de Nascimento*</label>
                    <input type="date" name="data" id="data" required>
                </div>
            </div>

            <div class="linha-inputs">
                <div class="campo">
                    <label for="senha">Senha*</label>
                    <input type="password" name="senha" id="senha" placeholder="Crie uma senha" required>
                </div>
                <div class="campo">
                    <label for="senha2">Confirmação de senha*</label>
                    <input type="password" name="senha2" id="senha2" placeholder="Repita a senha" required>
                </div>
            </div>

            <div class="regra">
                <p><strong>Senha segura:</strong></p>
                <ul>
                    <li>Mínimo de 6 dígitos</li>
                    <li>Mínimo de uma letra maiúscula</li>
                    <li>Mínimo de um número</li>
                    <li>Mínimo de um caractere especial (Ex: @, !, #)</li>
                </ul>
            </div>

            <div class="botao-container">
                <p>Será enviado um código para o e-mail cadastrado, favor conferir se está correto.</p>
                <button type="submit">Enviar e-mail</button>
            </div>
        </form>
    </main>
</body>
</html>
